[package]
name = "cruft"
version = "0.3.1"
edition = "2021"
description = "Find and remove reclaimable build and cache directories like node_modules and target"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["disk", "cleanup", "node_modules", "cli"]
categories = ["command-line-utilities", "filesystem"]
repository = "https://github.com/zhh2001/cruft"
homepage = "https://github.com/zhh2001/cruft"

# Matches the archives uploaded by .github/workflows/release.yml so
# `cargo binstall cruft` can fetch a prebuilt binary.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
walkdir = "2"
jwalk = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
trash = "5"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
