[package]
name = "cruft"
version = "0.1.0"
edition = "2021"
description = "Find and remove reclaimable build and cache directories like node_modules and target"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["disk", "cleanup", "node_modules", "cli"]
categories = ["command-line-utilities", "filesystem"]
# TODO: fill in once the repo is published
# repository = ""
# homepage = ""

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
jwalk = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
